name: Build TWA Android App

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      JAVA_HOME: /usr/lib/jvm/adoptopenjdk-17-hotspot-amd64
      BUBBLEWRAP_NO_INTERACTIVE: 'true'    # Bubblewrap non-interactive mode (optional)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Install dependencies and build web app
        run: |
          npm ci
          npm run build

      - name: Generate Keystore
        run: |
          keytool -genkeypair -alias key0 -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore release-key.jks -storepass keypass123 -keypass keypass123 \
            -dname "CN=WhatsOrder,O=WhatsOrder,C=US"

      - name: Create and run expect script to init TWA
        run: |
          cat << 'EOF' > bubblewrap-init.exp
          #!/usr/bin/expect -f
          set timeout 600

          spawn bubblewrap init --manifest=https://whats-order-osr3.vercel.app/manifest.json \
            --packageId=com.whatsorder.app \
            --signingKeyPath=./release-key.jks \
            --signingKeyAlias=key0 \
            --signingKeyPassword=keypass123 \
            --storePassword=keypass123 \
            --skipPwaValidation \
            --no-update-check

          expect {
            -re "Do you want Bubblewrap to install the JDK.*" {
              send "no\r"
              exp_continue
            }
            -re "Path to your existing JDK 17.*" {
              send "/usr/lib/jvm/adoptopenjdk-17-hotspot-amd64\r"
              exp_continue
            }
            -re "Do you want Bubblewrap to install the Android SDK.*" {
              send "yes\r"
              exp_continue
            }
            -re "Accept.*\\(y/N\\).*" {
              send "y\r"
              exp_continue
            }
            eof {
              puts "Bubblewrap init finished."
              exit 0
            }
            timeout {
              puts "Timeout hit, exiting."
              exit 1
            }
          }
          EOF
          chmod +x bubblewrap-init.exp
          ./bubblewrap-init.exp

      - name: Build TWA Android App
        run: bubblewrap build

      - name: Generate SHA256 fingerprint
        run: |
          keytool -list -v -keystore release-key.jks \
            -alias key0 -storepass keypass123 -keypass keypass123 | \
            grep SHA256: | sed 's/.*SHA256: //' | tr -d ':' > sha256.txt
          cat sha256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TWA-Release-APK
          path: app-release-signed.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: TWA-Release-AAB
          path: app-release.aab

      - name: Upload SHA256 Fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: SHA256-Fingerprint
          path: sha256.txt
