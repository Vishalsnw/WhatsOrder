name: Build TWA Android App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          npm install
          npm audit fix --force || true
          npx update-browserslist-db@latest || true

      - name: Build web app
        run: |
          npm run build

          # Verify out directory exists
          if [ ! -d "out" ]; then
            echo "Creating out directory..."
            mkdir -p out
            echo '<!DOCTYPE html><html><head><title>WhatsOrder</title></head><body><h1>Building...</h1></body></html>' > out/index.html
          fi

      - name: Setup Android with Capacitor
        run: |
          # Install Capacitor dependencies
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm install @capacitor/camera @capacitor/geolocation @capacitor/push-notifications
          npm install @capacitor/local-notifications @capacitor/preferences @capacitor/share
          npm install @capacitor/device @capacitor/network @capacitor/filesystem
          npm install @capacitor/status-bar @capacitor/keyboard @capacitor/haptics

          # Sync Capacitor project
          npx cap sync android

      - name: Generate release keystore (if not provided)
        if: env.KEYSTORE_PROVIDED != 'true'
        run: |
          cd android
          keytool -genkey -v -keystore app/whatsorder-release.keystore \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias whatsorder \
            -storepass whatsorder123 \
            -keypass whatsorder123 \
            -dname "CN=WhatsOrder,OU=Mobile,O=WhatsOrder,L=City,ST=State,C=US"

          # Get SHA256 fingerprint for Digital Asset Links
          keytool -list -v -keystore app/whatsorder-release.keystore \
            -alias whatsorder -storepass whatsorder123 -keypass whatsorder123 | \
            grep "SHA256:" | sed 's/.*SHA256: //' | tr -d ':' > sha256.txt

          echo "SHA256 Fingerprint for assetlinks.json:"
          cat sha256.txt

      - name: Build Android Release APK
        run: |
          cd android
          npx cap build android --prod --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TWA-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: TWA-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload SHA256 Fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: SHA256-Fingerprint
          path: sha256.txt