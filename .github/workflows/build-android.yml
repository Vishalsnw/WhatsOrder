name: Extract ZIP and Update Repo

on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract ZIP File and Clean Old Code
        run: |
          # Find any .zip file in the repository root
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ No .zip file found in root directory!"
            exit 0
          fi

          echo "📦 Found ZIP file: $ZIP_FILE"

          # Create a temporary directory for extraction
          TEMP_DIR="temp_extract_$(date +%s)"
          mkdir -p "$TEMP_DIR"

          # Extract zip contents into temp directory
          unzip -q "$ZIP_FILE" -d "$TEMP_DIR"

          # Check if zip contains a single nested folder
          NESTED_ITEMS=$(ls -A "$TEMP_DIR")
          COUNT=$(echo "$NESTED_ITEMS" | wc -l)

          if [ "$COUNT" -eq 1 ] && [ -d "$TEMP_DIR/$NESTED_ITEMS" ]; then
            echo "📂 Detected nested wrapper folder: $NESTED_ITEMS"
            SRC_DIR="$TEMP_DIR/$NESTED_ITEMS"
          else
            SRC_DIR="$TEMP_DIR"
          fi

          # Remove original ZIP file so it won't be committed
          rm -f "$ZIP_FILE"

          # Delete all existing root files/folders except .git, .github, and temp folder
          find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name '.github' ! -name "$TEMP_DIR" -exec rm -rf {} +

          # Copy extracted files to repository root
          cp -rn "$SRC_DIR/." . 2>/dev/null || cp -r "$SRC_DIR/." .
          rm -rf "$TEMP_DIR"

          echo "✅ Files extracted and repo updated successfully!"

      - name: Commit and Push Updated Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "ℹ️ No changes to commit."
          else
            git commit -m "Auto-extract ZIP and update project files [skip ci]"
            git push
          fi
