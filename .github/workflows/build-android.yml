name: Build TWA Android App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore release-key.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias key0 \
            -storepass keypass123 \
            -keypass keypass123 \
            -dname "CN=WhatsOrder,O=WhatsOrder,C=US"

      - name: Init TWA Project (Non-Interactive)
        run: |
          bubblewrap init --manifest=https://whats-order-osr3.vercel.app/manifest.json \
            --packageId=com.whatsorder.app \
            --signingKeyPath=release-key.jks \
            --signingKeyAlias=key0 \
            --signingKeyPassword=keypass123 \
            --storePassword=keypass123 \
            --skipPwaValidation \
            --skipJdkInstall \
            --jdkPath=/usr/lib/jvm/java-17-openjdk-amd64 \
            --no-tty

      - name: Build Android App
        run: bubblewrap build

      - name: Generate SHA256 fingerprint
        run: |
          keytool -list -v -keystore release-key.jks \
            -alias key0 \
            -storepass keypass123 \
            -keypass keypass123 | grep SHA256: | sed 's/.*SHA256: //' | tr -d ':' > sha256.txt
          cat sha256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TWA-Release-APK
          path: app-release-signed.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: TWA-Release-AAB
          path: app-release.aab

      - name: Upload SHA256 Fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: SHA256-Fingerprint
          path: sha256.txt
