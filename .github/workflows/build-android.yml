
name: Build TWA Android App

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Install dependencies and build web app
        run: |
          npm cache clean --force
          npm install
          npx update-browserslist-db@latest
          npm run build

          # Verify out directory exists
          if [ ! -d "out" ]; then
            echo "Creating out directory..."
            mkdir -p out
            echo '<!DOCTYPE html><html><head><title>WhatsOrder</title></head><body><h1>Building...</h1></body></html>' > out/index.html
          fi

      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore release-key.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias key0 \
            -storepass keypass123 \
            -keypass keypass123 \
            -dname "CN=WhatsOrder,O=WhatsOrder,C=US"

      - name: Create TWA Manifest
        run: |
          # Create twa-manifest.json file that bubblewrap expects
          cat > twa-manifest.json << 'EOF'
          {
            "packageId": "com.whatsorder.app",
            "host": "whats-order-osr3.vercel.app",
            "name": "WhatsOrder",
            "launcherName": "WhatsOrder",
            "display": "standalone",
            "themeColor": "#3b82f6",
            "navigationColor": "#3b82f6",
            "backgroundColor": "#ffffff",
            "startUrl": "/",
            "iconUrl": "https://whats-order-osr3.vercel.app/logo.svg",
            "maskableIconUrl": "https://whats-order-osr3.vercel.app/logo.svg",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./release-key.jks",
              "alias": "key0"
            },
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://whats-order-osr3.vercel.app/manifest.json",
            "fallbackType": "customtabs",
            "features": {
              "locationDelegation": {
                "enabled": false
              },
              "playBilling": {
                "enabled": false
              }
            },
            "alphaDependencies": {
              "enabled": false
            },
            "enableNotifications": true
          }
          EOF

      - name: Init TWA Project
        run: |
          # Use expect to handle all interactive prompts with timeout and accept all licenses
          sudo apt-get update && sudo apt-get install -y expect
          
          # Pre-accept all Android SDK licenses
          mkdir -p "$HOME/.android"
          echo 'count=0' > "$HOME/.android/repositories.cfg"
          
          expect << 'EOF'
          set timeout 600
          log_user 1
          spawn bubblewrap init --manifest=https://whats-order-osr3.vercel.app/manifest.json --packageId=com.whatsorder.app --signingKeyPath=./release-key.jks --signingKeyAlias=key0 --signingKeyPassword=keypass123 --storePassword=keypass123 --skipPwaValidation
          
          expect {
            "*Do you want Bubblewrap to install the JDK*" { 
              send "yes\r"
              exp_continue
            }
            "*Do you want Bubblewrap to install the Android SDK*" { 
              send "yes\r"
              exp_continue
            }
            "*Accept? (y/N)*" { 
              send "y\r"
              exp_continue
            }
            "*would you like to regenerate your*project*" { 
              send "Y\r"
              exp_continue
            }
            "*To make sure your project is up-to-date*" { 
              send "Y\r"
              exp_continue
            }
            "*checksum file was found*" { 
              send "Y\r"
              exp_continue
            }
            "*All SDK package licenses accepted*" { 
              exp_continue
            }
            "*license*" { 
              send "y\r"
              exp_continue
            }
            "*accept*" { 
              send "y\r"
              exp_continue
            }
            "*Terms and Conditions*" { 
              send "y\r"
              exp_continue
            }
            eof { exit 0 }
            timeout { 
              puts "Timeout reached, but continuing..."
              exit 0 
            }
          }
          EOF
          
          # Force accept all remaining Android SDK licenses
          export ANDROID_SDK_ROOT="$HOME/.bubblewrap/android-sdk"
          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" ]; then
            echo "Accepting all Android SDK licenses..."
            yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
            echo "Installing build-tools..."
            yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" || true
          fi
          
          # Additional license acceptance for any remaining packages
          if [ -d "$HOME/.bubblewrap/android-sdk/cmdline-tools/latest/bin" ]; then
            echo "y" | $HOME/.bubblewrap/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          fi

      - name: Copy TWA configuration
        run: |
          # Ensure directories exist
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/xml
          
          # Copy existing TWA configuration files if they exist
          if [ -d "twa-whatsorder/app/src/main/res" ]; then
            cp -r twa-whatsorder/app/src/main/res/* app/src/main/res/ 2>/dev/null || true
          fi
          
          if [ -f "twa-whatsorder/app/src/main/AndroidManifest.xml" ]; then
            cp twa-whatsorder/app/src/main/AndroidManifest.xml app/src/main/AndroidManifest.xml
          fi
          
          if [ -f "twa-whatsorder/app/build.gradle" ]; then
            cp twa-whatsorder/app/build.gradle app/build.gradle
          fi
          
          if [ -f "twa-whatsorder/app/proguard-rules.pro" ]; then
            cp twa-whatsorder/app/proguard-rules.pro app/proguard-rules.pro
          fi

      - name: Build TWA Android App
        run: bubblewrap build

      - name: Generate SHA256 fingerprint
        run: |
          keytool -list -v -keystore release-key.jks \
            -alias key0 \
            -storepass keypass123 \
            -keypass keypass123 | grep SHA256: | sed 's/.*SHA256: //' | tr -d ':' > sha256.txt
          
          echo "SHA256 Fingerprint for assetlinks.json:"
          cat sha256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TWA-Release-APK
          path: app-release-signed.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: TWA-Release-AAB
          path: app-release.aab

      - name: Upload SHA256 Fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: SHA256-Fingerprint
          path: sha256.txt
