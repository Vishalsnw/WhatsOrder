
name: Build Android APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Install dependencies
      run: npm ci
      
    - name: Install Capacitor and plugins
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npm install @capacitor/camera @capacitor/geolocation @capacitor/push-notifications
        npm install @capacitor/local-notifications @capacitor/storage @capacitor/share
        npm install @capacitor/device @capacitor/network @capacitor/filesystem
        npm install @capacitor/status-bar @capacitor/keyboard @capacitor/haptics
        
    - name: Build web app
      run: npm run build
      
    - name: Initialize Capacitor
      run: |
        if [ ! -d "android" ]; then
          npx cap init "WhatsOrder" "com.whatsorder.app" --web-dir=out
        fi
        
    - name: Add Android platform
      run: |
        if [ ! -d "android" ]; then
          npx cap add android
        fi
        
    - name: Sync Capacitor
      run: npx cap sync android
      
    - name: Make gradlew executable
      run: chmod +x android/gradlew
      
    - name: Build Debug APK
      run: cd android && ./gradlew assembleDebug
      
    - name: Build Release APK
      run: cd android && ./gradlew assembleRelease
      
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: android/app/build/outputs/apk/release/app-release-unsigned.apk

  build-signed:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Install dependencies
      run: npm ci
      
    - name: Install Capacitor and plugins
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npm install @capacitor/camera @capacitor/geolocation @capacitor/push-notifications
        npm install @capacitor/local-notifications @capacitor/storage @capacitor/share
        npm install @capacitor/device @capacitor/network @capacitor/filesystem
        npm install @capacitor/status-bar @capacitor/keyboard @capacitor/haptics
        
    - name: Build web app
      run: npm run build
      
    - name: Initialize Capacitor
      run: |
        if [ ! -d "android" ]; then
          npx cap init "WhatsOrder" "com.whatsorder.app" --web-dir=out
        fi
        
    - name: Add Android platform
      run: |
        if [ ! -d "android" ]; then
          npx cap add android
        fi
        
    - name: Sync Capacitor
      run: npx cap sync android
      
    - name: Decode Keystore
      if: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
        
    - name: Build Signed APK
      if: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        cd android
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=app/release.keystore \
          -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
          -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
          -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"
          
    - name: Build AAB for Play Store
      if: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        cd android
        ./gradlew bundleRelease \
          -Pandroid.injected.signing.store.file=app/release.keystore \
          -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
          -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
          -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"
          
    - name: Upload Signed APK
      if: ${{ secrets.KEYSTORE_BASE64 }}
      uses: actions/upload-artifact@v4
      with:
        name: signed-apk
        path: android/app/build/outputs/apk/release/app-release.apk
        
    - name: Upload AAB
      if: ${{ secrets.KEYSTORE_BASE64 }}
      uses: actions/upload-artifact@v4
      with:
        name: play-store-aab
        path: android/app/build/outputs/bundle/release/app-release.aab
