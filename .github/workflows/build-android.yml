name: Build Android APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'mobile_install'
        type: choice
        options:
          - mobile_install
          - debug
          - release
          - signed

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

      - name: Clear npm cache
        run: npm cache clean --force

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Clear npm cache
      run: npm cache clean --force

    - name: Install dependencies
      run: |
        rm -rf node_modules package-lock.json
        npm install

    - name: Install Capacitor and plugins
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npm install @capacitor/camera @capacitor/geolocation @capacitor/push-notifications
        npm install @capacitor/local-notifications @capacitor/preferences @capacitor/share
        npm install @capacitor/device @capacitor/network @capacitor/filesystem
        npm install @capacitor/status-bar @capacitor/keyboard @capacitor/haptics

    - name: Fix audit issues
      run: npm audit fix --audit-level moderate || true

    - name: Update browserslist
      run: npx update-browserslist-db@latest

    - name: Build web app
      run: |
        npm run build
        ls -la out/ || echo "Out directory not found"

    - name: Create assets directory
      run: mkdir -p android/app/src/main/assets

    - name: Initialize Capacitor
      run: |
        if [ ! -d "android" ]; then
          npx cap init "WhatsOrder" "com.whatsorder.app" --web-dir=out
        fi

    - name: Add Android platform
      run: |
        if [ ! -d "android" ]; then
          npx cap add android
        fi

    - name: Sync Capacitor
      run: |
        mkdir -p android/app/src/main/assets
        npx cap sync android

    - name: Make gradlew executable
      run: chmod +x android/gradlew

    - name: Generate Release Keystore (if not using secrets)
      if: ${{ !secrets.KEYSTORE_BASE64 }}
      run: |
        cd android
        keytool -genkey -v -keystore app/whatsorder-release.keystore \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -alias whatsorder \
          -storepass whatsorder123 \
          -keypass whatsorder123 \
          -dname "CN=WhatsOrder,OU=Mobile,O=WhatsOrder,L=City,ST=State,C=US"

        # Get SHA256 fingerprint for Digital Asset Links
        keytool -list -v -keystore app/whatsorder-release.keystore \
          -alias whatsorder -storepass whatsorder123 -keypass whatsorder123 | \
          grep "SHA256:" | sed 's/.*SHA256: //' | tr -d ':' > sha256.txt

        echo "SHA256 Fingerprint for assetlinks.json:"
        cat sha256.txt

    - name: Configure Release Signing (auto-generated keystore)
      if: ${{ !secrets.KEYSTORE_BASE64 }}
      run: |
        cd android
        cat >> app/build.gradle << 'EOF'

        android {
            signingConfigs {
                release {
                    storeFile file('whatsorder-release.keystore')
                    storePassword 'whatsorder123'
                    keyAlias 'whatsorder'
                    keyPassword 'whatsorder123'
                }
            }
            buildTypes {
                release {
                    signingConfig signingConfigs.release
                    minifyEnabled false
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                }
            }
        }
        EOF

    - name: Decode Custom Keystore (if provided)
      if: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

    - name: Configure Release Signing (custom keystore)
      if: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        cd android
        cat >> app/build.gradle << 'EOF'

        android {
            signingConfigs {
                release {
                    storeFile file('release.keystore')
                    storePassword '${{ secrets.KEYSTORE_PASSWORD }}'
                    keyAlias '${{ secrets.KEY_ALIAS }}'
                    keyPassword '${{ secrets.KEY_PASSWORD }}'
                }
            }
            buildTypes {
                release {
                    signingConfig signingConfigs.release
                    minifyEnabled false
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                }
            }
        }
        EOF

    - name: Build Debug APK
      if: ${{ inputs.build_type == 'debug' || github.event_name != 'workflow_dispatch' }}
      run: cd android && ./gradlew assembleDebug

    - name: Build Release APK (Signed)
      run: cd android && ./gradlew assembleRelease

    - name: Build AAB for Play Store
      run: cd android && ./gradlew bundleRelease

    - name: Upload Debug APK
      if: ${{ inputs.build_type == 'debug' || github.event_name != 'workflow_dispatch' }}
      uses: actions/upload-artifact@v4
      with:
        name: WhatsOrder-Debug-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Signed Release APK
      uses: actions/upload-artifact@v4
      with:
        name: WhatsOrder-Release-APK-Installable
        path: android/app/build/outputs/apk/release/app-release.apk

    - name: Upload AAB for Play Store
      uses: actions/upload-artifact@v4
      with:
        name: WhatsOrder-PlayStore-AAB
        path: android/app/build/outputs/bundle/release/app-release.aab

    - name: Upload SHA256 Fingerprint
      if: ${{ !secrets.KEYSTORE_BASE64 }}
      uses: actions/upload-artifact@v4
      with:
        name: SHA256-Fingerprint
        path: android/sha256.txt

    - name: Create Release Notes
      run: |
        cd android
        echo "# WhatsOrder Android App" > release-notes.md
        echo "" >> release-notes.md
        echo "## Installation Instructions" >> release-notes.md
        echo "1. Download the 'WhatsOrder-Release-APK-Installable' file" >> release-notes.md
        echo "2. Enable 'Install from unknown sources' in Android settings" >> release-notes.md
        echo "3. Install the APK file" >> release-notes.md
        echo "" >> release-notes.md
        echo "## Build Details" >> release-notes.md
        echo "- Build Date: $(date)" >> release-notes.md
        echo "- Git Commit: ${{ github.sha }}" >> release-notes.md
        echo "- Package: com.whatsorder.app" >> release-notes.md

        if [ ! -f "../secrets.KEYSTORE_BASE64" ]; then
          echo "- Signing: Auto-generated keystore" >> release-notes.md
          echo "- SHA256 for assetlinks.json: $(cat sha256.txt 2>/dev/null || echo 'Check SHA256-Fingerprint artifact')" >> release-notes.md
        else
          echo "- Signing: Custom keystore provided" >> release-notes.md
        fi

    - name: Upload Release Notes
      uses: actions/upload-artifact@v4
      with:
        name: Release-Notes
        path: android/release-notes.md

  build-signed:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

      - name: Clear npm cache
        run: npm cache clean --force

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Clear npm cache
      run: npm cache clean --force

    - name: Install dependencies
      run: |
        rm -rf node_modules package-lock.json
        npm install

    - name: Install Capacitor and plugins
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npm install @capacitor/camera @capacitor/geolocation @capacitor/push-notifications
        npm install @capacitor/local-notifications @capacitor/preferences @capacitor/share
        npm install @capacitor/device @capacitor/network @capacitor/filesystem
        npm install @capacitor/status-bar @capacitor/keyboard @capacitor/haptics

    - name: Fix audit issues
      run: npm audit fix --audit-level moderate || true

    - name: Update browserslist
      run: npx update-browserslist-db@latest

    - name: Build web app
      run: |
        npm run build
        ls -la out/ || echo "Out directory not found"

    - name: Create assets directory
      run: mkdir -p android/app/src/main/assets

    - name: Initialize Capacitor
      run: |
        if [ ! -d "android" ]; then
          npx cap init "WhatsOrder" "com.whatsorder.app" --web-dir=out
        fi

    - name: Add Android platform
      run: |
        if [ ! -d "android" ]; then
          npx cap add android
        fi

    - name: Sync Capacitor
      run: |
        mkdir -p android/app/src/main/assets
        npx cap sync android

    - name: Decode Keystore
      if: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

    - name: Build Signed APK
      if: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        cd android
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=app/release.keystore \
          -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
          -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
          -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

    - name: Build AAB for Play Store
      if: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        cd android
        ./gradlew bundleRelease \
          -Pandroid.injected.signing.store.file=app/release.keystore \
          -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
          -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
          -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

    - name: Upload Signed APK
      if: ${{ secrets.KEYSTORE_BASE64 }}
      uses: actions/upload-artifact@v4
      with:
        name: signed-apk
        path: android/app/build/outputs/apk/release/app-release.apk

    - name: Upload AAB
      if: ${{ secrets.KEYSTORE_BASE64 }}
      uses: actions/upload-artifact@v4
      with:
        name: play-store-aab
        path: android/app/build/outputs/bundle/release/app-release.aab