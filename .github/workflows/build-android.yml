name: Build TWA Android App

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'PWA URL with manifest.json'
        required: true
        default: 'https://whats-order-osr3.vercel.app/'
      package_name:
        description: 'Android package name'
        required: true
        default: 'com.whatsorder.twa'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Create signing key if not provided
        if: ${{ !secrets.KEYSTORE_BASE64 }}
        run: |
          keytool -genkey -v \
            -keystore release-key.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias key0 \
            -storepass keypass123 \
            -keypass keypass123 \
            -dname "CN=WhatsOrder,O=WhatsOrder,C=US"
          echo "No keystore secret provided, generated default key."

      - name: Decode provided keystore
        if: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release-key.jks

      - name: Init TWA Project
        run: |
          bubblewrap init --manifest=${{ github.event.inputs.app_url }}manifest.json \
            --packageId=${{ github.event.inputs.package_name }} \
            --signingKeyPath=release-key.jks \
            --signingKeyAlias=key0 \
            --signingKeyPassword=${{ secrets.KEY_PASSWORD || 'keypass123' }} \
            --storePassword=${{ secrets.KEYSTORE_PASSWORD || 'keypass123' }} \
            --skipPwaValidation

      - name: Build Android App
        run: bubblewrap build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TWA-Release-APK
          path: app-release-signed.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: TWA-Release-AAB
          path: app-release.aab
