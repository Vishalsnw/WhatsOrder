name: Manual Android Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - signed
      environment:
        description: 'Environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - production

jobs:
  manual-build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Build web app
        run: |
          npm run build
          ls -la out/ || echo "Out directory not found"

      - name: Create assets directory
        run: mkdir -p android/app/src/main/assets

      - name: Initialize Capacitor
        run: |
          if [ ! -d "android" ]; then
            npx cap init "WhatsOrder" "com.whatsorder.app" --web-dir=out
          fi

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: |
          mkdir -p android/app/src/main/assets
          npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        if: ${{ inputs.build_type == 'debug' }}
        run: cd android && ./gradlew assembleDebug

      - name: Build Release APK
        if: ${{ inputs.build_type == 'release' }}
        run: cd android && ./gradlew assembleRelease

      - name: Decode Keystore
        if: ${{ inputs.build_type == 'signed' && env.HAS_KEYSTORE }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Build Signed APK
        if: ${{ inputs.build_type == 'signed' && env.HAS_KEYSTORE }}
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=app/release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Upload Debug APK
        if: ${{ inputs.build_type == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: manual-debug-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        if: ${{ inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: manual-release-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload Signed APK
        if: ${{ inputs.build_type == 'signed' && env.HAS_KEYSTORE }}
        uses: actions/upload-artifact@v4
        with:
          name: manual-signed-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk