
name: Build APK for Mobile Installation

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name (optional)'
        required: false
        default: 'WhatsOrder'

jobs:
  build-mobile-apk:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install and build web app
      run: |
        npm install
        npm run build

    - name: Setup Android project
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npm install @capacitor/camera @capacitor/geolocation @capacitor/push-notifications
        npm install @capacitor/local-notifications @capacitor/preferences @capacitor/share
        npm install @capacitor/device @capacitor/network @capacitor/filesystem
        npm install @capacitor/status-bar @capacitor/keyboard @capacitor/haptics
        
        if [ ! -d "android" ]; then
          npx cap init "${{ inputs.app_name || 'WhatsOrder' }}" "com.whatsorder.app" --web-dir=out
          npx cap add android
        fi
        
        npx cap sync android

    - name: Generate signing keystore
      run: |
        cd android
        keytool -genkey -v -keystore app/release.keystore \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -alias whatsorder \
          -storepass android123 \
          -keypass android123 \
          -dname "CN=WhatsOrder App,OU=Mobile,O=WhatsOrder,L=Unknown,ST=Unknown,C=US"

    - name: Configure signing
      run: |
        cd android/app
        cat >> build.gradle << 'EOF'
        
        android {
            signingConfigs {
                release {
                    storeFile file('release.keystore')
                    storePassword 'android123'
                    keyAlias 'whatsorder'
                    keyPassword 'android123'
                }
            }
            buildTypes {
                release {
                    signingConfig signingConfigs.release
                    minifyEnabled false
                }
            }
        }
        EOF

    - name: Build signed APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Get APK info
      run: |
        APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
        APK_SIZE=$(ls -lh "$APK_PATH" | awk '{print $5}')
        echo "APK_SIZE=$APK_SIZE" >> $GITHUB_ENV
        echo "APK built successfully: $APK_SIZE"

    - name: Upload Ready-to-Install APK
      uses: actions/upload-artifact@v4
      with:
        name: WhatsOrder-${{ github.run_number }}-ReadyToInstall.apk
        path: android/app/build/outputs/apk/release/app-release.apk

    - name: Create install instructions
      run: |
        cat > install-instructions.txt << 'EOF'
        📱 WhatsOrder Android App - Installation Instructions
        
        1. Download the APK file from the artifacts above
        2. On your Android device:
           - Go to Settings > Security (or Privacy)
           - Enable "Install apps from unknown sources" or "Allow from this source"
        3. Open the downloaded APK file
        4. Tap "Install" when prompted
        5. Open the app and enjoy!
        
        App Details:
        - Package: com.whatsorder.app
        - Version: Built from commit ${{ github.sha }}
        - Size: ${{ env.APK_SIZE }}
        - Compatible with Android 7.0+ (API level 24+)
        
        Need help? The app will work just like the web version but with native Android features!
        EOF

    - name: Upload install instructions
      uses: actions/upload-artifact@v4
      with:
        name: Installation-Instructions
        path: install-instructions.txt
